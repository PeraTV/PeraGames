name: Publicar PeraGames

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: peragames-windows
          path: dist/release/PeraGames-Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npx electron-builder --linux dir --${{ matrix.arch }} --publish never --config.asar=false
      - name: Empacotar Flatpak
        env:
          PACK_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          unpacked=$(find dist/release -maxdepth 1 -type d -name 'linux*unpacked' -print -quit)
          cp -a "$unpacked" packaging/flatpak/electron-app
          manifest=packaging/flatpak/io.github.PeraTV.PeraGames.json
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=flatpak-repo flatpak-build "$manifest"
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo flatpak-repo "PeraGames-Linux-$PACK_ARCH.flatpak" io.github.PeraTV.PeraGames
      - uses: actions/upload-artifact@v4
        with:
          name: peragames-linux-${{ matrix.arch }}
          path: PeraGames-Linux-*.flatpak
          if-no-files-found: error

  mac:
    runs-on: macos-15
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Gerar DMG universal
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac dmg --universal --publish never
            rm -f dist/release/latest-mac.yml
          else
            npx electron-builder --mac dmg zip --universal --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: peragames-mac
          path: |
            dist/release/PeraGames-macOS-*.dmg
            dist/release/PeraGames-macOS-*.zip
            dist/release/latest-mac.yml
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, linux, mac]
    if: ${{ always() && needs.windows.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: peragames-*
          path: release-files
          merge-multiple: true
      - name: Publicar instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          if gh release view "$tag" >/dev/null 2>&1; then
            for file in release-files/*; do
              if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$file")"; then
                gh release upload "$tag" "$file"
              fi
            done
          else
            gh release create "$tag" release-files/* --target "$GITHUB_SHA" --title "PeraGames $tag" --generate-notes
          fi

