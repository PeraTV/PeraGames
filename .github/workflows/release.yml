name: Publicar PeraGames

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: peragames-windows
          path: dist/release/PeraGames-Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npx electron-builder --linux dir --${{ matrix.arch }} --publish never --config.asar=false
      - name: Empacotar Flatpak
        env:
          PACK_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          unpacked=$(find dist/release -maxdepth 1 -type d -name 'linux*unpacked' -print -quit)
          cp -a "$unpacked" packaging/flatpak/electron-app
          manifest=packaging/flatpak/io.github.PeraTV.PeraGames.json
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=flatpak-repo flatpak-build "$manifest"
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo flatpak-repo "PeraGames-Linux-$PACK_ARCH.flatpak" io.github.PeraTV.PeraGames
      - uses: actions/upload-artifact@v4
        with:
          name: peragames-linux-${{ matrix.arch }}
          path: PeraGames-Linux-*.flatpak
          if-no-files-found: error

  mac:
    runs-on: macos-15
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Gerar DMG universal
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac dmg --universal --publish never
            rm -f dist/release/latest-mac.yml
          else
            npx electron-builder --mac dmg zip --universal --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: peragames-mac
          path: |
            dist/release/PeraGames-macOS-*.dmg
            dist/release/PeraGames-macOS-*.zip
            dist/release/latest-mac.yml
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, linux, mac]
    if: ${{ github.ref == 'refs/heads/main' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.mac.result == 'success' }}
    concurrency:
      group: peragames-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: peragames-*
          path: release-files
          merge-multiple: true
      - name: Publicar instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          latest=$(gh release list --limit 100 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
          if [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$(printf '%s\n' "$tag" "$latest" | sort -V | tail -1)" != "$tag" ]]; then
            exit 0
          fi
          installers=(PeraGames-Windows-x64-Setup.exe PeraGames-Linux-x64.flatpak PeraGames-Linux-arm64.flatpak PeraGames-macOS-universal.dmg)
          for name in "${installers[@]}"; do
            test -s "release-files/$name"
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            existing=$(gh release view "$tag" --json assets --jq '.assets[].name')
            for file in release-files/*; do
              if ! grep -Fxq "$(basename "$file")" <<< "$existing"; then
                gh release upload "$tag" "$file"
              fi
            done
            gh release edit "$tag" --latest
          else
            gh release create "$tag" release-files/* --target "$GITHUB_SHA" --title "PeraGames $tag" --generate-notes --latest
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          jq -e --arg tag "$tag" '.tag_name == $tag' <<< "$current" >/dev/null
          published=$(jq -r '.assets[].name' <<< "$current")
          for name in "${installers[@]}"; do
            grep -Fxq "$name" <<< "$published"
          done
          for name in PeraGames-Linux-x64.flatpak PeraGames-Linux-arm64.flatpak; do
            jq -e --arg name "$name" \
              '.assets[] | select(.name == $name and (.digest // "" | test("^sha256:[0-9a-fA-F]{64}$")))' <<< "$current" >/dev/null
          done
